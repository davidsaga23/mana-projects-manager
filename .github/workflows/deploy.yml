# Deploys to cPanel over FTP whenever main is updated.
#
# Only changed files are transferred — the action keeps a small state file on the
# server to track what it has already uploaded.
#
# SAFETY: the exclude list below protects live server state. config.php holds the
# database and SMTP passwords, and uploads/ holds ticket attachments — syncing
# either would overwrite credentials or delete real files. Do not remove them.

name: Deploy to cPanel

on:
  push:
    branches: [main, master]   # this repo's branch is "master"; either name deploys
  workflow_dispatch:        # allows a manual run from the Actions tab
  pull_request:             # a PR gets the syntax check before it is merged;
    branches: [main, master]  # the deploy job below is skipped for PRs

jobs:
  # ⚠ A SYNTAX CHECK BEFORE ANYTHING REACHES THE SERVER (2026-10-28). Nothing
  # else stands between a merge and the live site, and nobody working on this
  # repo can run PHP locally, so one missing bracket in a file every page loads
  # (header.php, auth.php) would take the whole app down in 30 seconds. php -l
  # only proves each file PARSES; it does not run anything or touch a database.
  # If it fails, the deploy job below never starts and the live site is untouched.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: PHP syntax check (php -l on every tracked .php file)
        run: |
          php --version
          failed=0
          while IFS= read -r f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; failed=1; }
          done < <(git ls-files '*.php')
          if [ "$failed" -ne 0 ]; then
            echo "::error::PHP syntax errors above. Nothing was deployed."
            exit 1
          fi
          echo "Every PHP file parses."

  deploy:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sync changed files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Target directory on the server. Must end with a slash.
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          protocol: ftps
          # Show what would change without transferring anything:
          # flip to true, push, and read the Actions log.
          #
          # Was ON through the account move of 2026-10-03, until run #159 reported
          # "Making changes to 0 files" — which is the proof that mattered: a
          # wrong target folder reads as hundreds of files to upload, because the
          # action cannot find the sync state file previous deploys left behind.
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/tools/**
            **/node_modules/**
            config.php
            sessions/**
            uploads/**
            *.md
            *.zip

  # ⚠ THE NEW HOST, IN PARALLEL (David, 2026-11-11, moving to KnownHost at
  # anima-mana.com; docs/HOSTING_MIGRATION.md). Until the cut-over every merge
  # goes to BOTH servers: the old one stays the live site the team works on,
  # and the new one always runs the same code, so the cut-over is a data copy
  # rather than a code copy. At the cut-over the `deploy` job above is removed
  # and this one becomes the only deploy.
  #
  # Its own secrets (KH_FTP_SERVER, KH_FTP_USERNAME, KH_FTP_PASSWORD), so the
  # old host's are untouched. Until they are set, the sync step is skipped and
  # the job passes: merging this before the secrets exist changes nothing.
  #
  # The FTP account is created with public_html as its home, so the target is
  # its own top folder. The server name is the machine's (cp50-ga), not
  # anima-mana.com, because that is the name on the FTP certificate. The first
  # run uploads every file (there is no sync state file there yet); after that,
  # only what changed.
  deploy-knownhost:
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KH_FTP_SERVER: ${{ secrets.KH_FTP_SERVER }}
    steps:
      - name: Check out the repository
        if: env.KH_FTP_SERVER != ''
        uses: actions/checkout@v4

      - name: Sync changed files over FTP to KnownHost (anima-mana.com)
        if: env.KH_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.KH_FTP_SERVER }}
          username: ${{ secrets.KH_FTP_USERNAME }}
          password: ${{ secrets.KH_FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          dry-run: false
          # The same list as above, for the same reasons: never overwrite the
          # new server's config.php, uploads or sessions.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/tools/**
            **/node_modules/**
            config.php
            sessions/**
            uploads/**
            *.md
            *.zip

      - name: Say so when the KnownHost secrets are not set yet
        if: env.KH_FTP_SERVER == ''
        run: echo "::notice::KH_FTP_SERVER is not set, so nothing was sent to KnownHost. Add the three KH_FTP_* secrets to switch this on."
